name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.2-windows.1 (tag windows-v<version> is created)"
        required: true
        type: string
      dry_run:
        description: "Build and package all architectures but do not create or update a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'ghostty-org/ghostty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x64
            inno_arch: x64compatible
            runner: windows-2025
            target_flags: ""
          # GitHub-hosted Windows 11 ARM64 runner, so `zig build test` runs on
          # real ARM64 hardware. Zig 0.16.0's aarch64-windows binary crashes
          # on `zig build` (https://codeberg.org/ziglang/zig/issues/31865), so
          # the x86_64 Zig runs under x64 emulation and targets ARM64.
          - arch: aarch64
            label: arm64
            inno_arch: arm64
            runner: windows-11-arm
            target_flags: "-Dtarget=aarch64-windows-gnu"
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        if: matrix.arch != 'aarch64'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: release-windows-${{ matrix.arch }}-${{ hashFiles('build.zig.zon') }}

      # Workaround for https://codeberg.org/ziglang/zig/issues/31865 (see matrix).
      - name: Setup Zig (x86_64 Zig under emulation on Windows ARM64)
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $ver = '0.16.0'
          $sha = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $zip = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$ver.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip"
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $sha) { throw "zig sha256 mismatch: $got" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$ver" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$ver\zig.exe") version

      - name: Fetch dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            zig build --fetch=all
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Resolve version
        shell: pwsh
        run: |
          $v = $env:RAW_VERSION -replace '^windows-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$v`nTAG=windows-v$v`n")

      - name: Build
        shell: pwsh
        run: zig build -Dapp-runtime=win32 -Doptimize=ReleaseFast -Dcpu=baseline ${{ matrix.target_flags }} "-Dversion-string=$env:VERSION" -p build/release

      - name: Test
        run: zig build test -Dapp-runtime=win32 ${{ matrix.target_flags }}

      - name: Package zip
        shell: pwsh
        run: ./dist/windows/make-zip.ps1 -Prefix build/release -Version $env:VERSION -Arch ${{ matrix.arch }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DInnoArch=${{ matrix.inno_arch }}" "/DSourceDir=$PWD\dist\windows\out\staging\ghostty" "/DOutputDir=$PWD\dist\windows\out" dist\windows\installer\ghostty.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Collect assets
        shell: pwsh
        run: |
          $out = 'dist/windows/out'
          $assets = New-Item -ItemType Directory -Force 'release-assets'
          Copy-Item "$out/ghostty-$env:VERSION-windows-${{ matrix.arch }}.zip" "$assets/Ghostty-Windows-${{ matrix.label }}.zip"
          Copy-Item "$out/ghostty-$env:VERSION-windows-${{ matrix.arch }}-setup.exe" "$assets/Ghostty-Windows-Setup-${{ matrix.label }}.exe"
          Get-ChildItem $assets -File | Format-Table Name, Length

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        shell: pwsh
        run: |
          $v = $env:RAW_VERSION -replace '^windows-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$v`nTAG=windows-v$v`n")

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        shell: pwsh
        run: |
          $assets = 'release-assets'
          Get-ChildItem $assets -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii "$assets/SHA256SUMS.txt"
          Get-Content "$assets/SHA256SUMS.txt"

      - name: Upload combined assets (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-all
          path: release-assets/*
          if-no-files-found: error

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $notes = "Ghostty for Windows $env:VERSION, an unofficial community port of [Ghostty](https://github.com/ghostty-org/ghostty).`n`n**Install:** download ``Ghostty-Windows-Setup-x64.exe`` (or ``Ghostty-Windows-Setup-arm64.exe`` on Windows on ARM) and run it (per-user, no admin needed).`n**Portable:** unzip ``Ghostty-Windows-x64.zip`` (or ``Ghostty-Windows-arm64.zip``) and run ``ghostty\bin\ghostty.exe``.`n`nThe binaries are not code-signed yet, so Windows SmartScreen may ask you to confirm (More info, then Run anyway). Verify downloads against ``SHA256SUMS.txt``."
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title "Ghostty for Windows $env:VERSION" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
