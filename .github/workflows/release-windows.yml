name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.2-windows.1 (tag windows-v<version> is created)"
        required: true
        type: string
      dry_run:
        description: "Build and package all architectures but do not create or update a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'ghostty-org/ghostty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x64
            inno_arch: x64compatible
            target_flags: ""
          # ARM64 is cross-compiled and packaged on the x64 runner; its unit
          # tests run natively on windows-11-arm in `test-arm64`. Building on
          # windows-11-arm is not viable with Zig 0.16.0: the native
          # aarch64-windows Zig crashes on `zig build`
          # (https://codeberg.org/ziglang/zig/issues/31865) and the x86_64 Zig
          # under emulation is too slow (~50 min).
          - arch: aarch64
            label: arm64
            inno_arch: arm64
            target_flags: "-Dtarget=aarch64-windows-gnu"
    name: build (${{ matrix.arch }})
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: release-windows-${{ matrix.arch }}-${{ hashFiles('build.zig.zon') }}

      - name: Fetch dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            zig build --fetch=all
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Resolve version
        shell: pwsh
        run: |
          $v = $env:RAW_VERSION -replace '^windows-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$v`nTAG=windows-v$v`n")

      - name: Build
        shell: pwsh
        run: zig build -Dapp-runtime=win32 -Doptimize=ReleaseFast -Dcpu=baseline ${{ matrix.target_flags }} "-Dversion-string=$env:VERSION" -p build/release

      - name: Test
        if: matrix.arch == 'x86_64'
        run: zig build test -Dapp-runtime=win32

      # -Demit-test-exe installs the test binary and skips running it here
      # (the x64 host cannot execute it); `test-arm64` runs it.
      - name: Build tests (aarch64)
        if: matrix.arch == 'aarch64'
        run: zig build test -Dapp-runtime=win32 ${{ matrix.target_flags }} -Dcpu=baseline -Demit-test-exe -p zig-test

      - name: Upload test binary (aarch64)
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostty-test-windows-aarch64
          path: zig-test/bin/ghostty-test.exe
          if-no-files-found: error

      - name: Package zip
        shell: pwsh
        run: ./dist/windows/make-zip.ps1 -Prefix build/release -Version $env:VERSION -Arch ${{ matrix.arch }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DInnoArch=${{ matrix.inno_arch }}" "/DSourceDir=$PWD\dist\windows\out\staging\ghostty" "/DOutputDir=$PWD\dist\windows\out" dist\windows\installer\ghostty.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Collect assets
        shell: pwsh
        run: |
          $out = 'dist/windows/out'
          $assets = New-Item -ItemType Directory -Force 'release-assets'
          Copy-Item "$out/ghostty-$env:VERSION-windows-${{ matrix.arch }}.zip" "$assets/Ghostty-Windows-${{ matrix.label }}.zip"
          Copy-Item "$out/ghostty-$env:VERSION-windows-${{ matrix.arch }}-setup.exe" "$assets/Ghostty-Windows-Setup-${{ matrix.label }}.exe"
          Get-ChildItem $assets -File | Format-Table Name, Length

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  test-arm64:
    needs: build
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      # Tests run from the repo root, like `zig build test` does.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghostty-test-windows-aarch64
          path: zig-test/bin

      - name: Test (native ARM64)
        shell: pwsh
        run: |
          & .\zig-test\bin\ghostty-test.exe
          if ($LASTEXITCODE -ne 0) { throw "ghostty-test.exe failed with $LASTEXITCODE" }

  publish:
    needs: [build, test-arm64]
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        shell: pwsh
        run: |
          $v = $env:RAW_VERSION -replace '^windows-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$v`nTAG=windows-v$v`n")

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        shell: pwsh
        run: |
          $assets = 'release-assets'
          Get-ChildItem $assets -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii "$assets/SHA256SUMS.txt"
          Get-Content "$assets/SHA256SUMS.txt"

      - name: Upload combined assets (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-all
          path: release-assets/*
          if-no-files-found: error

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $notes = "Ghostty for Windows $env:VERSION, an unofficial community port of [Ghostty](https://github.com/ghostty-org/ghostty).`n`n**Install:** download ``Ghostty-Windows-Setup-x64.exe`` (or ``Ghostty-Windows-Setup-arm64.exe`` on Windows on ARM) and run it (per-user, no admin needed).`n**Portable:** unzip ``Ghostty-Windows-x64.zip`` (or ``Ghostty-Windows-arm64.zip``) and run ``ghostty\bin\ghostty.exe``.`n`nThe binaries are not code-signed yet, so Windows SmartScreen may ask you to confirm (More info, then Run anyway). Verify downloads against ``SHA256SUMS.txt``."
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title "Ghostty for Windows $env:VERSION" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
